name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push snapshot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf .github
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout --orphan space-deploy
          git add -A
          git commit -m "Deploy from GitHub Actions (${{ github.sha }})"
          git push --force "https://Kervcodes:${HF_TOKEN}@huggingface.co/spaces/Kervcodes/kerv-digital-twin" space-deploy:main
